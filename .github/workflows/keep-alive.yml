name: Keep Supabase Alive

on:
  schedule:
    # Every 6 days at 08:00 UTC (Supabase pauses after 7 days of inactivity)
    - cron: "0 8 */6 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -sf https://nadav-28-party-game-xpjh.vercel.app/api/ping
